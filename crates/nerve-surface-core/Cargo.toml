[package]
name = "nerve-surface-core"
description = "Everything a Nerve surface does that is not drawing."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Path semantics for the `openURL` half of the hook contract. `nerve-hub`
# encodes with the same module, so the two ends cannot drift.
nerve-platform = { path = "../nerve-platform" }
# Frame decoding only. A surface consumes the hub contract, it never serves.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The wire is ISO8601 second-precision `Z` (`crates/nerve-hub/src/model/time.rs`),
# so the same date library the hub already pulls in parses it here.
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }

# No `tokio`, no HTTP client, no terminal library, no GUI toolkit — on purpose.
# This crate is the part of a surface that has no pixels: every port is
# blocking and pull-based so the composition root owns scheduling, and every
# derivation is a pure function a test can call without an OS.

[features]
# Frame fixtures shared by every surface's tests. Never enabled by a binary.
testkit = []

[dev-dependencies]
# The fixtures this crate's own tests read.
nerve-surface-core = { path = ".", features = ["testkit"] }
serde_json = "1"
