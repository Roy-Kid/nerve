[package]
name = "nerve-tmux-surface"
description = "tmux sidebar surface for the Nerve hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# The library is what `tests/` drives; the binary is a thin composition root
# (spec Design: "main.rs — 组合根:只做装配与信号处理,无业务逻辑").
[lib]
name = "nerve_tmux_surface"
path = "src/lib.rs"

[[bin]]
name = "nerve-tmux-surface"
path = "src/main.rs"

[dependencies]
# Everything this surface does that is not drawing a terminal.
nerve-surface-core = { path = "../nerve-surface-core" }
# Ad-hoc JSON the terminal side reads directly: tmux pane metadata, the popup's
# one-shot job read, preview payloads. Frame decoding itself lives in
# `nerve-surface-core`.
serde_json = "1"
# The wire is ISO8601 second-precision `Z` (`crates/nerve-hub/src/model/time.rs`),
# so the same date library the hub already pulls in parses it here. Every
# feature named below is already enabled by `nerve-hub`, so this adds no crate
# to the tree and no new resolution.
time = { version = "0.3", features = ["formatting", "parsing", "macros", "serde"] }
# `kill(pid, 0)` for the single-instance guard's liveness probe
# (`instance::SignalProbe`). A dependency rather than a hand-rolled FFI call
# because `unsafe_code` is forbidden workspace-wide, and the same one
# `nerve-hub` already reaps producer pids with — so this adds no crate to the
# tree and no new resolution.
rustix = { version = "1", features = ["process"] }
ratatui = "0.30"
crossterm = "0.29"
unicode-width = "0.2"

# No `tokio`, on purpose. Every port in this crate is blocking:
#   * `stream::FrameSource` is pull-based (`open` / `next_frame`),
#   * `stream::StreamSession` never sleeps — `Backoff` computes a delay and the
#     composition root waits,
#   * `tmux::TmuxRunner` and `launch::ProcessSpawner` are `std::process` shaped.
# One long-lived SSE connection plus occasional `tmux` calls is a single-thread
# blocking workload; an async runtime here would buy nothing and would make
# every unit test need an executor.

# No HTTP client either. The three requests this surface makes are `GET`s on
# loopback with no body, no redirect, no TLS and no auth, so `src/hub.rs` writes
# them over `std::net::TcpStream` — the same way `crates/nerve-hub`'s own SSE
# test reads the stream it serves.

# No dev-dependencies: `serde_json::json!` builds the fixtures and
# `time::macros::datetime!` builds the injected instants, both from the
# dependencies above.
