[package]
name = "nerve-windows-surface"
description = "Windows tray surface for the Nerve hub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "nerve_windows_surface"
path = "src/lib.rs"

[dependencies]
# Everything this surface does that is not drawing.
nerve-surface-core = { path = "../nerve-surface-core" }
# Path shape, for deciding whether a reported location is one this machine
# could open at all.
nerve-platform = { path = "../nerve-platform" }
# The tray icon and the in-panel ribbon are the same axis-aligned rounded bars
# at two sizes, so one rasteriser draws both. Pure safe-API Rust, no system
# dependency — which is what keeps `unsafe_code = "forbid"` honest here.
tiny-skia = "0.11"
# The redraw gate's hash. Non-cryptographic and fast on purpose: it runs every
# frame and exists to avoid a shell round trip, so it must cost less than what
# it saves.
rustc-hash = "2"

[dev-dependencies]
nerve-surface-core = { path = "../nerve-surface-core", features = ["testkit"] }
serde_json = "1"
