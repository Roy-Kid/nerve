# Commit-tier CI parity (mol:ship commit). Push/merge tiers run the full
# suites (cargo test --workspace, npm test && npm run build, verify_loop.sh).
repos:
  - repo: local
    hooks:
      - id: cargo-fmt-check
        name: cargo fmt --check
        entry: cargo fmt --check
        language: system
        files: '\.rs$'
        pass_filenames: false
      - id: cargo-clippy
        name: cargo clippy -D warnings
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        files: '(\.rs$|Cargo\.(toml|lock)$)'
        pass_filenames: false
      - id: nerve-hook-tests
        name: nerve hook unit tests
        entry: python3 sources/agents/tests/test_nerve_hook.py
        language: system
        files: '^(plugins/nerve/hooks/|sources/agents/tests/)'
        pass_filenames: false
