# Nerve tmux sidebar

if -F '#{==:#{@nerve_sidebar_width},}' 'set -g @nerve_sidebar_width 15%'
if -F '#{==:#{@nerve_sidebar_position},}' 'set -g @nerve_sidebar_position left'
if -F '#{==:#{@nerve_sidebar_bottom_height},}' 'set -g @nerve_sidebar_bottom_height 20'
if -F '#{==:#{@nerve_sidebar_auto_create},}' 'set -g @nerve_sidebar_auto_create on'
if -F '#{==:#{@nerve_sidebar_key},}' 'set -g @nerve_sidebar_key e'

if -F '#{==:#{@nerve_sidebar_close_key},}' 'set -g @nerve_sidebar_close_key q'

run-shell 'key="$(tmux display-message -p "#{@nerve_sidebar_key}")"; close_key="$(tmux display-message -p "#{@nerve_sidebar_close_key}")"; bin="$(tmux display-message -p "#{@nerve_sidebar_bin}")"; tmux bind "$key" run-shell "\"$bin\" toggle \"##{window_id}\" \"##{pane_current_path}\""; tmux bind "$close_key" run-shell "\"$bin\" close \"##{window_id}\""'

# Legacy bindings from older nerve installs.
run-shell 'tmux list-keys -T prefix 2>/dev/null | grep -q "nerve-tmux-surface.*popup" && tmux unbind-key -T prefix j 2>/dev/null || true'
run-shell 'tmux list-keys -T prefix 2>/dev/null | grep -q "nerve-tmux-surface.*toggle-all" && tmux unbind-key -T prefix E 2>/dev/null || true'

# Legacy tmux-agent-sidebar hooks survive plugin removal; clear them once.
run-shell 'tmux show-hooks -g after-new-window 2>/dev/null | grep -q agent_sidebar && tmux set-hook -gu after-new-window || true'
run-shell 'tmux show-hooks -g pane-exited 2>/dev/null | grep -q agent_sidebar && tmux set-hook -gu pane-exited || true'

if -F '#{!=:#{@nerve_sidebar_auto_create},off}' {
  set-hook -g after-new-window 'run-shell "\"#{@nerve_sidebar_bin}\" toggle --create-only \"#{window_id}\" \"#{pane_current_path}\""'
}

set-hook -g pane-exited 'run-shell "\"#{@nerve_sidebar_bin}\" auto-close \"#{window_id}\""'
